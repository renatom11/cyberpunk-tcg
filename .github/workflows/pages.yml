name: Deploy the playable site to GitHub Pages

on:
  push:
    branches: [claude/wizardly-archimedes-e20tzv, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch the Pyodide runtime (self-hosted so the page can be cross-origin isolated)
        run: |
          mkdir -p /tmp/pyo && cd /tmp/pyo && npm pack pyodide@0.26.4 && tar xzf pyodide-0.26.4.tgz
      - name: Build the static site
        run: python tools/build_site.py --out site --pyodide-dir /tmp/pyo/package
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
