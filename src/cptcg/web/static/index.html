<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cptcg — Cyberpunk TCG Simulator</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="brand">CYBERPUNK TCG <span>sim lab</span></div>
  <nav>
    <button data-mode="play" class="active">PLAY</button>
    <button data-mode="watch">WATCH</button>
    <button data-mode="lab">LAB</button>
    <button data-mode="build">BUILD</button>
    <button data-mode="cards">CARDS</button>
  </nav>
</header>

<main id="play" class="mode">
  <div id="setup" class="setup">
    <h2>New game</h2>
    <div class="row"><label>Your deck <select id="deckMe"></select></label></div>
    <div class="row"><label>AI deck <select id="deckAi"></select></label></div>
    <div class="row">
      <label>AI <select id="agent"><option value="heuristic">heuristic</option><option value="random">random</option></select></label>
      <label>You sit <select id="seat"><option value="0">seat 0</option><option value="1">seat 1</option></select></label>
      <label>Seed <input id="seed" type="number" placeholder="random"></label>
    </div>
    <button id="newGame" class="primary">START</button>
    <p class="hint">Cards render as images when <code>data/images/&lt;id&gt;.png</code> exists, otherwise as text cards.</p>
  </div>
  <div id="board" class="board hidden"></div>
</main>

<main id="watch" class="mode hidden">
  <div class="setup">
    <h2>Watch a replay</h2>
    <div class="row"><label>Replay <select id="replayFile"></select></label>
      <button id="loadReplay" class="primary">LOAD</button></div>
    <div class="row replay-controls hidden" id="replayControls">
      <button id="rpStart">⏮</button><button id="rpPrev">◀</button>
      <input id="rpSlider" type="range" min="0" max="0" value="0">
      <button id="rpNext">▶</button><button id="rpEnd">⏭</button>
      <button id="rpAuto">AUTO</button>
      <span id="rpPos"></span>
    </div>
  </div>
  <div id="rpBoard" class="board hidden"></div>
</main>

<main id="lab" class="mode hidden">
  <div class="setup">
    <h2>Lab reports</h2>
    <div class="row"><label>Tournament <select id="reportFile"></select></label>
      <button id="loadReport" class="primary">OPEN</button></div>
    <div id="report"></div>
  </div>
</main>

<main id="build" class="mode hidden">
  <div class="builder">
    <section class="library panel">
      <div class="row">
        <input id="bSearch" placeholder="search name, text, tag…">
        <select id="bType"><option value="">any type</option><option>Legend</option><option>Unit</option><option>Program</option><option>Gear</option></select>
        <select id="bColor"><option value="">any colour</option><option>Red</option><option>Green</option><option>Blue</option><option>Yellow</option><option>Purple</option><option>Grey</option></select>
        <select id="bCost"><option value="">any cost</option><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6+</option></select>
        <label><input id="bLegal" type="checkbox" checked> legal for these Legends</label>
        <span id="bCount" class="dim"></span>
      </div>
      <div id="bGrid" class="card-grid"></div>
    </section>
    <section class="decksheet panel">
      <div class="row">
        <input id="bName" placeholder="deck name" value="New deck">
        <select id="bLoad"><option value="">load…</option></select>
        <button id="bSave" class="primary">SAVE</button>
        <button id="bExport">EXPORT</button>
        <button id="bClear">CLEAR</button>
      </div>
      <div class="row">
        <span class="dim">AI build:</span>
        <button id="bBuildH">HEURISTIC</button>
        <button id="bBuildR">RANDOM</button>
        <label class="dim"><input id="bKeepLegends" type="checkbox" checked> keep my Legends</label>
      </div>
      <div class="legend-area">
        <span class="lbl">LEGENDS</span>
        <div id="bLegends" class="legend-slots"></div>
        <div id="bRam" class="ram"></div>
      </div>
      <div class="row curve-row"><span class="lbl">COST CURVE</span><div id="bCurve" class="curve"></div><span id="bSize" class="size"></span></div>
      <div id="bStatus" class="status"></div>
      <div id="bList" class="decklist"></div>
      <textarea id="bText" class="hidden" rows="12" readonly></textarea>
    </section>
  </div>
</main>

<main id="cards" class="mode hidden">
  <div class="setup">
    <h2>Card pool</h2>
    <div class="row"><input id="cardSearch" placeholder="search name, text, tag…"></div>
    <div id="cardGrid" class="card-grid"></div>
  </div>
</main>

<div id="popover" class="popover hidden"></div>
<script src="/static/app.js"></script>
</body>
</html>
